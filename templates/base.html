<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title | $site_name</title>
<meta name="description" content="$description">
<meta name="robots" content="$robots">
<meta name="theme-color" content="#05070f">
<link rel="canonical" href="$canonical">
<meta property="og:type" content="$og_type">
<meta property="og:site_name" content="$site_name">
<meta property="og:title" content="$title">
<meta property="og:description" content="$description">
<meta property="og:url" content="$canonical">
<meta property="og:image" content="$origin/assets/images/social-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="SK Attestation Services — Your Documents. A Clearer Next Step.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="$title">
<meta name="twitter:description" content="$description">
<meta name="twitter:image" content="$origin/assets/images/social-card.png">
<link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
<link rel="alternate" type="application/rss+xml" title="SK Attestation blog" href="/feed.xml">
<link rel="preload" href="/assets/fonts/outfit.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/theme.css">
<link rel="stylesheet" href="/assets/css/site.css">
<script src="/assets/js/theme.js"></script>
<script type="application/ld+json">$schema</script>
<script src="/assets/js/checker.js" defer></script>
<script src="/assets/js/site.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="bg-mesh" aria-hidden="true"></div><div class="bg-grid" aria-hidden="true"></div>
$header
<main id="main">$body</main>
$footer
</body>
</html>
